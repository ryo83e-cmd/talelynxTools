<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixAI プロンプトジェネレーター</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --sub-text: #64748b;
      --border: #e2e8f0;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 30px 15px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .nav-back {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }
    .nav-back:hover { text-decoration: underline; }
    
    .layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
    }
    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
    }
    
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    h2, h3 { margin-bottom: 16px; color: #0f172a; }
    
    .section-title {
      font-size: 15px;
      font-weight: bold;
      margin: 16px 0 8px;
      color: #334155;
      border-left: 4px solid var(--primary);
      padding-left: 8px;
    }
    .options-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .chip {
      padding: 6px 12px;
      font-size: 13px;
      border: 1px solid var(--border);
      background: #f8fafc;
      border-radius: 20px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }
    .chip:hover { background: #f1f5f9; border-color: #cbd5e1; }
    .chip.selected {
      background: #eff6ff;
      color: #1d4ed8;
      border-color: #3b82f6;
      font-weight: bold;
    }
    .color-settings-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
      width: 100%;
      font-size: 13px;
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
    }
    .color-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .color-row input[type="color"] {
      border: none;
      width: 30px;
      height: 30px;
      cursor: pointer;
      border-radius: 4px;
      background: none;
    }

    .preview-sticky { position: sticky; top: 20px; }
    .preview-box {
      background: #e2e8f0;
      border-radius: 8px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .prompt-output {
      width: 100%;
      height: 90px;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #f8fafc;
      resize: none;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    .copy-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.2s;
    }
    .copy-btn:hover { background: var(--primary-hover); }
    .copy-btn.copied { background: #10b981; }
  </style>
</head>
<body>

  <div style="max-width: 1000px; margin: 0 auto;">
    <a href="./index.html" class="nav-back">&larr; ポータルに戻る</a>
    <h1 style="margin-bottom: 20px; font-size: 24px;">PixAI プロンプトジェネレーター</h1>

    <div class="layout">
      <!-- 選択フォームエリア -->
      <div>
        <div class="panel" id="formContainer">
          <h3>キャラクター設定</h3>
        </div>
      </div>

      <!-- プレビュー＆出力エリア -->
      <div class="preview-sticky">
        <div class="panel">
          <h3>イメージプレビュー</h3>
          <div class="preview-box">
            <svg id="avatarSvg" width="160" height="220" viewBox="0 0 160 220">
              <ellipse cx="80" cy="180" rx="40" ry="50" fill="#cbd5e1" />
              <path id="svgClothes" d="M40 160 Q80 140 120 160 L130 220 L30 220 Z" fill="#3b82f6" />
              <circle cx="80" cy="90" r="35" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" />
              <path id="svgHair" d="M45 80 Q80 30 115 80 Q130 140 110 180 Q80 160 50 180 Q30 140 45 80 Z" fill="#94a3b8" />
            </svg>
          </div>

          <h3>生成プロンプト (PixAI用)</h3>
          <textarea id="promptResult" class="prompt-output" readonly></textarea>
          <button id="copyBtn" class="copy-btn">プロンプトをコピー</button>
          
          <!-- PixAIへジャンプするリンクボタン -->
          <a href="https://pixai.art/ja/generator/image" target="_blank" rel="noopener noreferrer" style="display: block; margin-top: 10px; text-align: center; padding: 12px; background: #0f172a; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 14px; transition: background 0.2s;">
            PixAIジェネレーターを開く &rarr;
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="./pixaiConfig.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const config = window.pixaiConfig;
      if (!config) {
        alert('pixaiConfig.js が読み込まれていません。');
        return;
      }

      const formContainer = document.getElementById('formContainer');
      const promptResult = document.getElementById('promptResult');
      const copyBtn = document.getElementById('copyBtn');
      const svgHair = document.getElementById('svgHair');
      const svgClothes = document.getElementById('svgClothes');

      config.promptGroups.forEach(g => {
        const titleEl = document.createElement('div');
        titleEl.className = 'section-title';
        titleEl.textContent = g.title;
        formContainer.appendChild(titleEl);

        const gridEl = document.createElement('div');
        gridEl.className = 'options-grid';
        gridEl.setAttribute('data-group', g.group);
        gridEl.setAttribute('data-type', g.type);

        if (g.type === 'customColorPicker') {
          // 髪色・インナー・メッシュのカラーピッカー専用レイアウト
          const colorBox = document.createElement('div');
          colorBox.className = 'color-settings-box';
          colorBox.innerHTML = `
            <div class="color-row">
              <input type="color" id="baseColorPicker" value="#94a3b8">
              <span>ベース髪色: <strong id="baseColorHex">#94a3b8</strong></span>
            </div>
            <div class="color-row">
              <input type="color" id="innerColorPicker" value="#ff758c">
              <label><input type="checkbox" id="enableInnerColor"> インナーカラー有効化</label>
            </div>
            <div class="color-row">
              <input type="color" id="meshColorPicker" value="#38bdf8">
              <label><input type="checkbox" id="enableMeshColor"> メッシュカラー有効化</label>
            </div>
          `;
          gridEl.appendChild(colorBox);

          // イベント連動
          colorBox.querySelector('#baseColorPicker').addEventListener('input', (e) => {
            document.getElementById('baseColorHex').textContent = e.target.value;
            updateAll();
          });
          colorBox.querySelectorAll('input').forEach(input => {
            input.addEventListener('change', updateAll);
            input.addEventListener('input', updateAll);
          });

        } else {
          // 通常のチップ選択肢
          g.options.forEach(opt => {
            const chip = document.createElement('div');
            chip.className = `chip ${opt.selected ? 'selected' : ''}`;
            chip.setAttribute('data-tag', opt.tag);
            chip.textContent = opt.label;

            chip.addEventListener('click', () => {
              if (g.type === 'single') {
                gridEl.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
                chip.classList.add('selected');
              } else {
                chip.classList.toggle('selected');
              }
              updateAll();
            });

            gridEl.appendChild(chip);
          });
        }

        formContainer.appendChild(gridEl);
      });

      function updateAll() {
        const selectedChips = document.querySelectorAll('.chip.selected');
        let tags = [];
        selectedChips.forEach(chip => {
          const t = chip.getAttribute('data-tag');
          if (t) tags.push(t);
        });

        // カスタム髪色・インナー・メッシュのタグ生成
        const baseHex = document.getElementById('baseColorPicker')?.value || '#94a3b8';
        tags.push(`[${baseHex}] hair`);

        const enableInner = document.getElementById('enableInnerColor');
        if (enableInner && enableInner.checked) {
          const innerHex = document.getElementById('innerColorPicker').value;
          tags.push(`streaked hair, [${innerHex}] inner hair`);
        }

        const enableMesh = document.getElementById('enableMeshColor');
        if (enableMesh && enableMesh.checked) {
          const meshHex = document.getElementById('meshColorPicker').value;
          tags.push(`colored eyelashes, [${meshHex}] streaks`);
        }

        // 先頭にクオリティ指定タグを追加
        const qualityPrefix = "(masterpiece, best quality, ultra detailed, cinematic anime illustration:1.2)";
        const allTags = [qualityPrefix, ...tags];

        const finalPrompt = allTags.join(', ');
        promptResult.value = finalPrompt;

        // プレビューのベース色を即時反映
        svgHair.setAttribute('fill', baseHex);
        config.updatePreviewAppearance(finalPrompt, svgHair, svgClothes);
      }

      copyBtn.addEventListener('click', () => {
        promptResult.select();
        navigator.clipboard.writeText(promptResult.value).then(() => {
          copyBtn.textContent = 'コピーしました！';
          copyBtn.classList.add('copied');
          setTimeout(() => {
            copyBtn.textContent = 'プロンプトをコピー';
            copyBtn.classList.remove('copied');
          }, 2000);
        });
      });

      updateAll();
    });
  </script>
  <!-- 共通フッター -->
<footer style="margin-top: 40px; padding: 20px 0; border-top: 1px solid #e2e8f0; text-align: center; color: #64748b; font-size: 13px;">

</body>
