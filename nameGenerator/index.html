<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>名前生成エンジン</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <a href="/index.html" class="nav-back">&larr; ポータルに戻る</a>
    <h1>名前生成設定</h1>

    <div class="form-group">
      <label for="cultureSelect">地域・文化圏:</label>
      <select id="cultureSelect"></select>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="genderSelect">性別:</label>
        <select id="genderSelect">
          <option value="m">男性</option>
          <option value="f">女性</option>
          <option value="any">指定なし</option>
        </select>
      </div>

      <div class="form-group">
        <label for="eraInput">年代 (西暦):</label>
        <input type="number" id="eraInput" value="2020" min="1000" max="2100">
      </div>
    </div>

    <!-- 地域ごとに動的挿入されるフィルタ領域 -->
    <div id="dynamicFilters" class="dynamic-filters"></div>

    <button id="generateBtn" class="primary-btn">メジャーな名前を10件生成</button>

    <div class="result-container">
      <h2>出力結果</h2>
      <ul id="resultsList"></ul>
    </div>
  </div>

  <!-- 共通フッター -->
  <footer style="margin-top: 40px; padding: 20px 0; border-top: 1px solid #e2e8f0; text-align: center; color: #64748b; font-size: 13px;">
    <div style="max-width: 900px; margin: 0 auto; padding: 0 15px;">
      <p style="margin-bottom: 8px;">
        &copy; <span id="copyright-year"></span> Tools Portal. All rights reserved.
      </p>
      <p style="font-size: 12px; line-height: 1.5;">
        当サイトで生成・処理されたデータはすべてブラウザ上で完結しており、外部サーバーに保存されることはありません。<br>
        本ツールの利用によって生じたいかなる損害・トラブルについても、当方は一切の責任を負いかねます。
      </p>
      <div style="margin-top: 10px; display: flex; justify-content: center; gap: 15px;">
        <a href="./index.html" style="color: #3b82f6; text-decoration: none;">ホーム</a>
        <a href="#" onclick="alert('オープンソースライセンス:\n本ツール群はMITライセンス等のオープンソースソフトウェアおよび各種CDNライブラリ等を利用してブラウザ上で動作しています。'); return false;" style="color: #3b82f6; text-decoration: none;">利用規約・ライセンス</a>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    // 著作権の年号を自動で現在の年に設定
    document.getElementById('copyright-year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
