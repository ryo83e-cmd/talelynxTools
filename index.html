<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diff Tool</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f8f9fa;
      color: #333;
    }
    h1 {
      font-size: 1.3rem;
      margin-bottom: 16px;
    }
    .editor-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    .pane {
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 12px;
    }
    .pane-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 0.9rem;
    }
    .counter {
      font-weight: normal;
      color: #666;
    }
    textarea {
      width: 100%;
      height: 200px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
      font-family: monospace;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }
    button {
      padding: 8px 16px;
      background: #0066cc;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #0052a3;
    }
    .diff-output {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.5;
      min-height: 120px;
    }
    .diff-added {
      background: #e6ffed;
      color: #22863a;
      text-decoration: none;
    }
    .diff-removed {
      background: #ffeef0;
      color: #cb2431;
      text-decoration: line-through;
    }
    .diff-line-add {
      background: #e6ffed;
      color: #22863a;
      display: block;
    }
    .diff-line-del {
      background: #ffeef0;
      color: #cb2431;
      display: block;
    }
    .diff-line-same {
      color: #555;
      display: block;
    }
  </style>
</head>
<body>

  <h1>テキスト比較ツール</h1>

  <div class="editor-container">
    <div class="pane">
      <div class="pane-header">
        <span>テキスト A (変更前)</span>
        <span class="counter" id="count-a">文字数: 0 / 行数: 0</span>
      </div>
      <textarea id="text-a" placeholder="比較元のテキストを入力..."></textarea>
    </div>
    <div class="pane">
      <div class="pane-header">
        <span>テキスト B (変更後)</span>
        <span class="counter" id="count-b">文字数: 0 / 行数: 0</span>
      </div>
      <textarea id="text-b" placeholder="比較先のテキストを入力..."></textarea>
    </div>
  </div>

  <div class="controls">
    <label>
      <input type="radio" name="mode" value="line" checked> 行単位で比較
    </label>
    <label>
      <input type="radio" name="mode" value="char"> 文字単位で比較
    </label>
  </div>

  <div class="pane-header">
    <strong>差分結果</strong>
  </div>
  <div id="output" class="diff-output"></div>

  <script>
    const textA = document.getElementById('text-a');
    const textB = document.getElementById('text-b');
    const countA = document.getElementById('count-a');
    const countB = document.getElementById('count-b');
    const output = document.getElementById('output');
    const modeRadios = document.querySelectorAll('input[name="mode"]');

    function updateCounters() {
      const valA = textA.value;
      const linesA = valA ? valA.split('\n').length : 0;
      countA.textContent = `文字数: ${valA.length} / 行数: ${linesA}`;

      const valB = textB.value;
      const linesB = valB ? valB.split('\n').length : 0;
      countB.textContent = `文字数: ${valB.length} / 行数: ${linesB}`;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // 最小編集距離アルゴリズムによる差分計算
    function computeDiff(arrA, arrB) {
      const n = arrA.length;
      const m = arrB.length;
      const dp = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));

      for (let i = 0; i <= n; i++) dp[i][0] = i;
      for (let j = 0; j <= m; j++) dp[0][j] = j;

      for (let i = 1; i <= n; i++) {
        for (let j = 1; j <= m; j++) {
          if (arrA[i - 1] === arrB[j - 1]) {
            dp[i][j] = dp[i - 1][j - 1];
          } else {
            dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1);
          }
        }
      }

      const diff = [];
      let i = n, j = m;

      while (i > 0 || j > 0) {
        if (i > 0 && j > 0 && arrA[i - 1] === arrB[j - 1]) {
          diff.unshift({ type: 'same', value: arrA[i - 1] });
          i--;
          j--;
        } else if (j > 0 && (i === 0 || dp[i][j - 1] <= dp[i - 1][j])) {
          diff.unshift({ type: 'add', value: arrB[j - 1] });
          j--;
        } else if (i > 0 && (j === 0 || dp[i][j - 1] > dp[i - 1][j])) {
          diff.unshift({ type: 'del', value: arrA[i - 1] });
          i--;
        }
      }

      return diff;
    }

    function renderDiff() {
      const mode = document.querySelector('input[name="mode"]:checked').value;
      const valA = textA.value;
      const valB = textB.value;

      if (!valA && !valB) {
        output.innerHTML = '';
        return;
      }

      if (mode === 'line') {
        const linesA = valA.split('\n');
        const linesB = valB.split('\n');
        const diff = computeDiff(linesA, linesB);

        let html = '';
        diff.forEach(item => {
          const esc = escapeHtml(item.value);
          if (item.type === 'add') {
            html += `<span class="diff-line-add">+ ${esc}</span>`;
          } else if (item.type === 'del') {
            html += `<span class="diff-line-del">- ${esc}</span>`;
          } else {
            html += `<span class="diff-line-same">  ${esc}</span>`;
          }
        });
        output.innerHTML = html;
      } else {
        const charsA = Array.from(valA);
        const charsB = Array.from(valB);
        const diff = computeDiff(charsA, charsB);

        let html = '';
        diff.forEach(item => {
          const esc = escapeHtml(item.value);
          if (item.type === 'add') {
            html += `<ins class="diff-added">${esc}</ins>`;
          } else if (item.type === 'del') {
            html += `<del class="diff-removed">${esc}</del>`;
          } else {
            html += esc;
          }
        });
        output.innerHTML = html;
      }
    }

    function handleInput() {
      updateCounters();
      renderDiff();
    }

    textA.addEventListener('input', handleInput);
    textB.addEventListener('input', handleInput);
    modeRadios.forEach(radio => radio.addEventListener('change', renderDiff));

    updateCounters();
  </script>
</body>
</html>
