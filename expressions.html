<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>描写語彙データベース</title>
<style>
  :root {
    --bg-color: #121316;
    --card-bg: #1c1e24;
    --border-color: #2e323b;
    --text-primary: #e6e8ec;
    --text-secondary: #9aa0a6;
    --accent-color: #e06c75;
    --accent-active: #98c379;
    --tag-bg: #282c34;
    --code-bg: #181a1f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    padding: 24px;
    line-height: 1.5;
  }
  header {
    max-width: 1200px;
    margin: 0 auto 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  h1 { font-size: 20px; font-weight: 600; }
  .tabs {
    display: flex;
    gap: 8px;
    border-bottom: 2px solid var(--border-color);
  }
  .tab-btn {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-secondary);
    padding: 8px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: -2px;
    transition: all 0.2s;
  }
  .tab-btn:hover { color: var(--text-primary); }
  .tab-btn.active {
    color: var(--accent-color);
    border-bottom: 2px solid var(--accent-color);
  }
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-input {
    flex: 1;
    min-width: 240px;
    padding: 8px 12px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    color: var(--text-primary);
    font-size: 14px;
  }
  .search-input:focus { outline: 1px solid var(--accent-color); }
  .action-btn {
    background: var(--tag-bg);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 8px 14px;
    font-size: 13px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  .action-btn:hover { background: var(--border-color); }
  .action-btn.primary {
    background: var(--accent-color);
    border-color: var(--accent-color);
    color: #fff;
    font-weight: 600;
  }
  .action-btn.primary:hover { opacity: 0.9; }

  .selection-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    padding: 8px 14px;
    border-radius: 4px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .selection-count {
    color: var(--accent-active);
    font-weight: 600;
    font-size: 15px;
  }

  main {
    max-width: 1200px;
    margin: 0 auto;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent-color);
  }
  .badge {
    background: var(--tag-bg);
    border: 1px solid var(--border-color);
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 3px;
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .card-desc {
    font-size: 12px;
    color: var(--text-secondary);
  }

  .style-block {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 4px;
  }
  .style-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
  }
  .style-name {
    color: #d19a66;
    font-weight: 600;
  }
  .style-notes {
    color: var(--text-secondary);
    font-size: 11px;
  }

  .token-container {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  /* 単語チップ */
  .token {
    background: var(--code-bg);
    border: 1px solid var(--border-color);
    padding: 4px 8px;
    font-size: 12px;
    border-radius: 4px;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s;
    color: var(--text-primary);
  }
  .token:hover {
    border-color: #5c6370;
  }
  /* 選択状態のチップ */
  .token.selected {
    background: #2d3b2d;
    border-color: var(--accent-active);
    color: #a8e6a3;
    font-weight: 500;
  }
  .token.selected::before {
    content: "✓ ";
    font-size: 10px;
  }

  .card-actions {
    margin-top: auto;
    display: flex;
    gap: 6px;
    justify-content: flex-end;
  }
  .small-btn {
    font-size: 11px;
    padding: 3px 8px;
    background: var(--tag-bg);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    border-radius: 3px;
    cursor: pointer;
  }
  .small-btn:hover {
    color: var(--text-primary);
    background: var(--border-color);
  }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--accent-color);
    color: #fff;
    padding: 8px 16px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 1000;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>
<body>

<header>
  <h1>描写語彙データベース（プロンプト構成用）</h1>
  
  <div class="tabs">
    <button id="tabSlang" class="tab-btn active" onclick="switchTab('slang')">隠語・換装語彙</button>
    <button id="tabOnomato" class="tab-btn" onclick="switchTab('onomatopoeia')">オノマトペ</button>
  </div>

  <div class="controls">
    <input type="text" id="searchInput" class="search-input" placeholder="検索ワードを入力..." oninput="render()">
    <button class="action-btn" onclick="clearCurrentSelection()">選択をリセット</button>
    <button class="action-btn primary" onclick="copySelectedTermsAsMarkdown()">選択語彙をプロンプト形式でコピー</button>
  </div>

  <div class="selection-bar">
    <span>選択中の語彙数: <span id="selectedCount" class="selection-count">0</span> 語</span>
    <span style="font-size: 11px; margin-left: 8px;">※ 各単語チップをクリックして個別選択 / 解除ができます</span>
  </div>
</header>

<main>
  <div id="gridContainer" class="grid"></div>
</main>

<div id="toast" class="toast">コピーしました</div>

<script src="slang.js"></script>
<script src="onomatopoeia.js"></script>

<script>
  let currentTab = 'slang';

  // 選択中の単語を追跡するマップ
  // slang: Map( targetName => Set(term) )
  // onomatopoeia: Set( word )
  const selectedSlang = new Map();
  const selectedOnomato = new Set();

  function showToast(text) {
    const toast = document.getElementById('toast');
    toast.textContent = text;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1500);
  }

  function updateCount() {
    let count = 0;
    if (currentTab === 'slang') {
      selectedSlang.forEach(set => count += set.size);
    } else {
      count = selectedOnomato.size;
    }
    document.getElementById('selectedCount').textContent = count;
  }

  function toggleSlangTerm(target, term) {
    if (!selectedSlang.has(target)) {
      selectedSlang.set(target, new Set());
    }
    const set = selectedSlang.get(target);
    if (set.has(term)) {
      set.delete(term);
      if (set.size === 0) selectedSlang.delete(target);
    } else {
      set.add(term);
    }
    updateCount();
    render();
  }

  function toggleOnomatoWord(word) {
    if (selectedOnomato.has(word)) {
      selectedOnomato.delete(word);
    } else {
      selectedOnomato.add(word);
    }
    updateCount();
    render();
  }

  function selectCardAllSlang(target, item, select) {
    const allTerms = item.styles.flatMap(s => s.terms);
    if (select) {
      if (!selectedSlang.has(target)) selectedSlang.set(target, new Set());
      const set = selectedSlang.get(target);
      allTerms.forEach(t => set.add(t));
    } else {
      selectedSlang.delete(target);
    }
    updateCount();
    render();
  }

  function clearCurrentSelection() {
    if (currentTab === 'slang') {
      selectedSlang.clear();
    } else {
      selectedOnomato.clear();
    }
    updateCount();
    render();
    showToast('選択をクリアしました');
  }

  function switchTab(tabName) {
    currentTab = tabName;
    document.getElementById('tabSlang').classList.toggle('active', tabName === 'slang');
    document.getElementById('tabOnomato').classList.toggle('active', tabName === 'onomatopoeia');

    const searchInput = document.getElementById('searchInput');
    searchInput.value = '';
    searchInput.placeholder = tabName === 'slang'
      ? '対象部位、スタイル、隠語名で検索...'
      : 'オノマトペ、カテゴリ、用例で検索...';

    updateCount();
    render();
  }

  function getFilteredData() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    if (currentTab === 'slang') {
      if (typeof SLANG_DATA === 'undefined') return [];
      return SLANG_DATA.filter(item =>
        !q || item.target.toLowerCase().includes(q) ||
        (item.description && item.description.toLowerCase().includes(q)) ||
        item.styles.some(s =>
          s.name.toLowerCase().includes(q) ||
          (s.notes && s.notes.toLowerCase().includes(q)) ||
          s.terms.some(t => t.toLowerCase().includes(q))
        )
      );
    } else {
      if (typeof ONOMATOPOEIA_DATA === 'undefined') return [];
      return ONOMATOPOEIA_DATA.filter(item =>
        !q || item.word.toLowerCase().includes(q) ||
        item.category.toLowerCase().includes(q) ||
        item.nuance.toLowerCase().includes(q) ||
        item.examples.some(ex => ex.toLowerCase().includes(q))
      );
    }
  }

  function render() {
    const container = document.getElementById('gridContainer');
    container.innerHTML = '';
    const data = getFilteredData();

    if (data.length === 0) {
      container.innerHTML = '<div style="color:var(--text-secondary); grid-column: 1/-1; padding: 24px 0;">該当項目がありません。</div>';
      return;
    }

    if (currentTab === 'slang') {
      data.forEach(item => {
        const selectedSet = selectedSlang.get(item.target) || new Set();
        const card = document.createElement('div');
        card.className = 'card';

        let stylesHtml = item.styles.map(s => {
          const tokens = s.terms.map(t => {
            const isSelected = selectedSet.has(t);
            return `<span class="token ${isSelected ? 'selected' : ''}" onclick="toggleSlangTerm('${item.target}', '${t}')">${t}</span>`;
          }).join('');

          return `
            <div class="style-block">
              <div class="style-header">
                <span class="style-name">[${s.name}]</span>
                <span class="style-notes">${s.notes || ''}</span>
              </div>
              <div class="token-container">${tokens}</div>
            </div>
          `;
        }).join('');

        card.innerHTML = `
          <div class="card-header">
            <span class="card-title">${item.target}</span>
            <span class="badge">${selectedSet.size} 選択中</span>
          </div>
          ${item.description ? `<div class="card-desc">${item.description}</div>` : ''}
          ${stylesHtml}
          <div class="card-actions">
            <button class="small-btn" onclick='selectCardAllSlang("${item.target}", ${JSON.stringify(item)}, true)'>この部位を全選択</button>
            <button class="small-btn" onclick='selectCardAllSlang("${item.target}", null, false)'>解除</button>
          </div>
        `;
        container.appendChild(card);
      });
    } else {
      data.forEach(item => {
        const isSelected = selectedOnomato.has(item.word);
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <span class="card-title">${item.word}</span>
            <span class="badge">${item.category}</span>
          </div>
          <div class="card-desc">${item.nuance}</div>
          <div class="token-container">
            <span class="token ${isSelected ? 'selected' : ''}" onclick="toggleOnomatoWord('${item.word}')">単語: ${item.word}</span>
          </div>
          <div class="card-desc" style="margin-top: 4px;">用例: ${item.examples.join(' / ')}</div>
        `;
        container.appendChild(card);
      });
    }
  }

  // 選択された語彙のみをAIプロンプト向けMarkdown形式でコピー
  function copySelectedTermsAsMarkdown() {
    let md = '';

    if (currentTab === 'slang') {
      if (selectedSlang.size === 0) {
        showToast('語彙が選択されていません');
        return;
      }
      md += '## 指定描写語彙・隠語リスト\n';
      md += '描写時は、対象部位・状態に対して以下の語彙を優先的に使用すること。\n\n';

      selectedSlang.forEach((termsSet, target) => {
        if (termsSet.size > 0) {
          md += `* **${target}**: ${Array.from(termsSet).join(', ')}\n`;
        }
      });
    } else {
      if (selectedOnomato.size === 0) {
        showToast('オノマトペが選択されていません');
        return;
      }
      md += '## 指定オノマトペリスト\n';
      md += '情景や身体反応の描写において、以下の擬音・擬態語を効果的に織り交ぜること。\n\n';

      const selectedList = ONOMATOPOEIA_DATA.filter(item => selectedOnomato.has(item.word));
      selectedList.forEach(item => {
        md += `* **${item.word}** (${item.category}): ${item.nuance}\n`;
      });
    }

    navigator.clipboard.writeText(md).then(() => {
      showToast('選択した語彙をプロンプト形式でコピーしました');
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    switchTab('slang');
  });
</script>
</body>
</html>
